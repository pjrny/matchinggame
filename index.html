<!DOCTYPE html>
<html lang="en" class="dark">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .animate-shake {
      animation: shake 0.35s ease-in-out;
    }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }
    .animate-pop {
      animation: pop 0.2s ease-out;
    }
    /* Subtle custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }

</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen antialiased selection:bg-indigo-500/30">

          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Multi-file CSV Dropzone -->
      <div id="csv-dropzone" class="mb-4 border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-2xl p-4 text-center bg-slate-950/60 transition cursor-pointer" onclick="document.getElementById('csv-file-input').click()">
        <input id="csv-file-input" type="file" accept=".csv,.tsv,.txt" multiple class="hidden" onchange="handleCSVFiles(this.files)" />
        <svg class="w-7 h-7 mx-auto mb-1.5 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>

      </div>

      <!-- Manual Paste Fallback -->
      <details class="mb-3 bg-slate-950/40 border border-slate-800 rounded-xl p-3">
        <summary class="text-xs font-semibold text-slate-300 cursor-pointer select-none">Or paste rows manually for a single deck</summary>
        <div class="mt-3">
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Target Deck</label>
          <select id="import-target" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 mb-2.5">
            <option value="english">GRE English Words</option>
            <option value="spanishVerbsCustom">Spanish 100 Verbs (German Defs)</option>
            <option value="kernwortschatz">Kernwortschatz (Core Vocab)</option>
            <option value="es_praesens">Spanish Präsens CSV</option>
            <option value="es_praeteritum">Spanish Präteritum CSV</option>
            <option value="es_imperfekt">Spanish Imperfekt CSV</option>
            <option value="es_weitere">Spanish Weitere Zeiten CSV</option>
            <option value="german">German Vocab (German Defs)</option>
            <option value="spanish">Spanish Vocab (English Defs)</option>
          </select>
          <textarea id="import-textarea" rows="5" placeholder="abeyance&#9;temporary suspension or inactivity (noun)&#10;abscond&#9;to leave hurriedly and secretly (verb)" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs font-mono text-slate-200 focus:outline-none focus:border-indigo-500 mb-2"></textarea>
          <button onclick="saveImportedDeck()" class="w-full py-2 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white">
            Save Pasted Rows
          </button>
        </div>

      <!-- Loaded Custom Decks Summary -->

      <div id="import-feedback" class="text-xs mb-3 hidden"></div>

        <div class="grid grid-cols-2 gap-2">
          <button onclick="exportBakedHTML()" class="px-3 py-2.5 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white transition">
            Download Baked HTML
          </button>
          <button onclick="copyCloudflareWorker()" class="px-3 py-2.5 rounded-xl text-xs font-bold bg-amber-600 hover:bg-amber-500 text-white transition">

        </div>

    // Stem-changing verbs (boot pattern in presente & subjuntivo)
    const STEM_CHANGES = {
      encontrar: ["o", "ue"],
      volver: ["o", "ue"],
      contar: ["o", "ue"],
      recordar: ["o", "ue"],
      pensar: ["e", "ie"],
      empezar: ["e", "ie"],
      comenzar: ["e", "ie"],
      perder: ["e", "ie"],
      entender: ["e", "ie"]
    };

    // -cer / -cir verbs with -zco in yo presente & all subjuntivo
    const ZCO_VERBS = new Set(["parecer", "conocer", "aparecer", "reconocer", "nacer", "ofrecer"]);

    function applyLastVowelChange(stem, fromV, toV) {
      const idx = stem.lastIndexOf(fromV);
      if (idx === -1) return stem;
      return stem.slice(0, idx) + toV + stem.slice(idx + 1);
    }

    function applyOrthoBeforeE(stem) {
      if (stem.endsWith("c")) return stem.slice(0, -1) + "qu";
      if (stem.endsWith("g")) return stem.slice(0, -1) + "gu";
      if (stem.endsWith("z")) return stem.slice(0, -1) + "c";
      return stem;
    }

    /**
     * Conjugates any of the 100 Spanish verbs into the requested tense and person index (0..4).
     */
    function conjugateSpanish(inf, tense, pIdx) {
      if (tense === "infinitivo") return inf;

      const irr = IRREGULAR_MAP[inf];
      if (irr && irr[tense]) return irr[tense][pIdx];

      const ending = inf.slice(-2); // ar, er, ir
      const stem = inf.slice(0, -2);

      // Futuro & Condicional
      if (tense === "futuro") {
        const fStem = (irr && irr.futStem) ? irr.futStem : inf;
        return fStem + ["é", "ás", "á", "emos", "án"][pIdx];
      }
      if (tense === "condicional") {
        const cStem = (irr && irr.futStem) ? irr.futStem : inf;
        return cStem + ["ía", "ías", "ía", "íamos", "ían"][pIdx];
      }

      // Imperfecto
      if (tense === "imperfecto") {
        if (ending === "ar") {
          return stem + ["aba", "abas", "aba", "ábamos", "aban"][pIdx];
        }
        return stem + ["ía", "ías", "ía", "íamos", "ían"][pIdx];
      }

      // Indefinido
      if (tense === "indefinido") {
        if (ending === "ar") {
          const s = pIdx === 0 ? applyOrthoBeforeE(stem) : stem;
          return s + ["é", "aste", "ó", "amos", "aron"][pIdx];
        }
        return stem + ["í", "iste", "ió", "imos", "ieron"][pIdx];
      }

      // Presente
      if (tense === "presente") {
        if (ZCO_VERBS.has(inf) && pIdx === 0) return stem.slice(0, -1) + "zco";
        let s = stem;
        if (STEM_CHANGES[inf] && pIdx !== 3) {
          s = applyLastVowelChange(stem, STEM_CHANGES[inf][0], STEM_CHANGES[inf][1]);
        }
        if (ending === "ar") return s + ["o", "as", "a", "amos", "an"][pIdx];
        if (ending === "er") return s + ["o", "es", "e", "emos", "en"][pIdx];
        return s + ["o", "es", "e", "imos", "en"][pIdx];
      }

      // Subjuntivo
      if (tense === "subjuntivo") {
        if (ZCO_VERBS.has(inf)) {
          return stem.slice(0, -1) + "zc" + ["a", "as", "a", "amos", "an"][pIdx];
        }
        let s = stem;
        if (STEM_CHANGES[inf] && pIdx !== 3) {
          s = applyLastVowelChange(stem, STEM_CHANGES[inf][0], STEM_CHANGES[inf][1]);
        }
        if (ending === "ar") {
          s = applyOrthoBeforeE(s);
          return s + ["e", "es", "e", "emos", "en"][pIdx];
        }
        return s + ["a", "as", "a", "amos", "an"][pIdx];
      }

      return inf;
    }

    function buildBakedHTMLString() {
      const serialized = JSON.stringify(customDecks);
      const rawDoc = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      return rawDoc.replace(
        /\/\/ BAKED_CUSTOM_DECKS_START[\s\S]*?\/\/ BAKED_CUSTOM_DECKS_END/,
        `// BAKED_CUSTOM_DECKS_START\n    const BAKED_CUSTOM_DECKS = ${serialized};\n    // BAKED_CUSTOM_DECKS_END`

    function exportBakedHTML() {
      const html = buildBakedHTMLString();
      const blob = new Blob([html], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "vocab-speed-drill-baked.html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      const fb = document.getElementById("import-feedback");
      fb.textContent = "Downloaded vocab-speed-drill-baked.html with all loaded CSV decks permanently embedded!";
      fb.className = "text-xs mb-3 text-emerald-400 font-semibold";
    }

    function copyCloudflareWorker() {
      const html = buildBakedHTMLString();
      const workerCode = `export default {\n  async fetch(request) {\n    const html = ${JSON.stringify(html)};\n    return new Response(html, {\n      headers: { "content-type": "text/html;charset=UTF-8" }\n    });\n  }\n};\n`;
      const ta = document.createElement("textarea");
      ta.value = workerCode;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);

      const fb = document.getElementById("import-feedback");
      fb.textContent = "Copied complete Cloudflare Worker script (with your baked CSVs) to clipboard!";
      fb.className = "text-xs mb-3 text-amber-300 font-semibold";
    }

      const target = document.getElementById("import-target").value;

      if (!raw) {
        fb.textContent = "Please paste at least 4 rows of Word and Definition.";
        fb.className = "text-xs mb-3 text-red-400";
        return;
      }

      const parsed = extractPairsFromCSV(raw, target);
      if (parsed.length < 4) {
        fb.textContent = "Could not parse at least 4 valid pairs. Separate columns with a Tab, Semicolon, or Comma.";
        fb.className = "text-xs mb-3 text-red-400";
        return;
      }

      customDecks[target] = parsed;
      saveJSON(STORAGE_KEYS.custom, customDecks);
      updateLoadedDecksSummary();

      fb.textContent = `Saved ${parsed.length} custom pairs to ${target}!`;
      fb.className = "text-xs mb-3 text-emerald-400 font-semibold";
      render();
    }

            { id: "futuro", label: "Futuro" },
            { id: "condicional", label: "Condicional" },
            { id: "subjuntivo", label: "Subjuntivo" }
          ];

      return `
        <div class="w-full max-w-md my-auto bg-slate-900 rounded-3xl p-6 sm:p-7 border border-slate-800 shadow-2xl">
          <div class="flex items-center justify-between mb-5">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-xl bg-indigo-500/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
              </div>
              <div>
                <h1 class="text-xl font-extrabold tracking-tight text-white leading-none">Speed Match</h1>
                <p class="text-[11px] text-slate-400 mt-0.5">Wrong match adds +1.00s</p>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="setConfig('soundOn', ${!soundOn})" title="Toggle Money Sound" class="p-2 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
                ${soundOn
                  ? `<svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>`
                  : `<svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>`
                }
              </button>
              <button onclick="openImportModal()" title="Import CSVs & Export" class="px-2.5 py-2 rounded-xl border border-indigo-500/40 bg-indigo-500/15 hover:bg-indigo-500/25 text-[11px] font-bold text-indigo-300 transition">
                + CSV / Export
              </button>
            </div>
          </div>

          <div class="space-y-5 mb-6">
            <!-- Grid Size -->
            <div>
              <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2 block">Grid Size</label>
              <div class="grid grid-cols-2 gap-2.5">
                <button onclick="setConfig('gridSize', 8)" class="py-2.5 rounded-xl border-2 text-xs font-bold transition ${gridSize === 8 ? 'border-indigo-500 bg-indigo-500/20 text-indigo-300' : 'border-slate-800 bg-slate-950/50 hover:border-slate-600 text-slate-400'}">
                  8 Blocks (4 Pairs)
                </button>
                <button onclick="setConfig('gridSize', 12)" class="py-2.5 rounded-xl border-2 text-xs font-bold transition ${gridSize === 12 ? 'border-indigo-500 bg-indigo-500/20 text-indigo-300' : 'border-slate-800 bg-slate-950/50 hover:border-slate-600 text-slate-400'}">
                  12 Blocks (6 Pairs)
                </button>
              </div>
            </div>

            <!-- Vocab Pool -->
            <div>
              <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2 block">Vocab Pool</label>
              <div class="grid grid-cols-2 gap-2.5">
                <button onclick="setConfig('mode', 'spanishVerbs')" class="p-2.5 rounded-xl border-2 text-left transition ${mode === 'spanishVerbs' ? 'border-cyan-500 bg-cyan-500/15 text-cyan-200' : 'border-slate-800 bg-slate-950/50 hover:border-slate-600 text-slate-400'}">
                  <div class="text-xs font-bold">ES Verbs → DE</div>
                  <div class="text-[10px] opacity-75 mt-0.5">${esVerbCount} ${uploadedVerbCount > 0 ? 'CSV pairs' : 'verbs'} · All tenses</div>
                </button>
                <button onclick="setConfig('mode', 'english')" class="p-2.5 rounded-xl border-2 text-left transition ${mode === 'english' ? 'border-emerald-500 bg-emerald-500/15 text-emerald-200' : 'border-slate-800 bg-slate-950/50 hover:border-slate-600 text-slate-400'}">
                  <div class="text-xs font-bold">GRE English</div>
                  <div class="text-[10px] opacity-75 mt-0.5">${engCount} super hard words</div>
                </button>
                <button onclick="setConfig('mode', 'german')" class="p-2.5 rounded-xl border-2 text-left transition ${mode === 'german' ? 'border-amber-500 bg-amber-500/15 text-amber-200' : 'border-slate-800 bg-slate-950/50 hover:border-slate-600 text-slate-400'}">
                  <div class="text-xs font-bold">German → DE</div>
                  <div class="text-[10px] opacity-75 mt-0.5">German definitions</div>
                </button>
                <button onclick="setConfig('mode', 'spanish')" class="p-2.5 rounded-xl border-2 text-left transition ${mode === 'spanish' ? 'border-fuchsia-500 bg-fuchsia-500/15 text-fuchsia-200' : 'border-slate-800 bg-slate-950/50 hover:border-slate-600 text-slate-400'}">
                  <div class="text-xs font-bold">Spanish → EN</div>
                  <div class="text-[10px] opacity-75 mt-0.5">English definitions</div>
                </button>
                ${kernCount > 0 ? `
                  <button onclick="setConfig('mode', 'kernwortschatz')" class="col-span-2 p-2.5 rounded-xl border-2 text-left transition ${mode === 'kernwortschatz' ? 'border-violet-500 bg-violet-500/15 text-violet-200' : 'border-slate-800 bg-slate-950/50 hover:border-slate-600 text-slate-400'}">
                    <div class="text-xs font-bold">Kernwortschatz (CSV)</div>
                    <div class="text-[10px] opacity-75 mt-0.5">${kernCount} loaded core vocabulary pairs</div>
                  </button>
                ` : ""}
              </div>
            </div>

            <!-- Tense Selector (Shown for Spanish Verbs mode) -->
            ${mode === "spanishVerbs" ? `
              <div>
                <label class="text-[11px] font-bold uppercase tracking-wider text-cyan-400/90 mb-2 block">Spanish Verb Tense</label>
                <div class="grid ${hasCSVTenses ? 'grid-cols-3' : 'grid-cols-4'} gap-1.5">
                  ${tenseOptions.map(t => `
                    <button onclick="setConfig('tense', '${t.id}')" class="py-1.5 px-1 rounded-lg border text-[11px] font-semibold transition truncate ${tense === t.id ? 'border-cyan-400 bg-cyan-500/20 text-cyan-200' : 'border-slate-800 bg-slate-950/60 hover:border-slate-600 text-slate-400'}">
                      ${t.label}
                    </button>
                  `).join("")}
                </div>
              </div>
            ` : ""}
          </div>

          <div class="space-y-2.5">
            <button onclick="startGame()" class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-sm tracking-wide shadow-lg shadow-indigo-950/60 transition flex items-center justify-center gap-2">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              Start Speed Drill
            </button>
            ${state.history.length > 0 ? `
              <button onclick="goToView('history')" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs border border-slate-700 transition">
                View Past Times (${state.history.length})
              </button>
            ` : ""}
          </div>
        </div>
      `;
    }

    function renderGame() {
      const totalMs = state.elapsed + state.penalties * 1000;
      const gridCols = state.config.gridSize === 12
        ? "grid-cols-3 sm:grid-cols-4"
        : "grid-cols-2 sm:grid-cols-4";

      return `
        <div class="w-full max-w-2xl flex flex-col items-center">
          <!-- Top HUD -->
          <div class="w-full flex items-center justify-between bg-slate-900/90 border border-slate-800 rounded-2xl px-4 py-3 mb-4 shadow-lg">
            <button onclick="goToView('dashboard')" title="Back to Dashboard" class="p-1.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>

            <div class="flex items-center gap-4">
              <div class="text-center">
                <div class="text-[9px] uppercase font-bold tracking-wider text-slate-500">Penalty</div>
                <div class="text-sm font-mono font-bold ${state.penalties > 0 ? 'text-red-400' : 'text-slate-400'}">+${state.penalties}s</div>
              </div>
              <div class="bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-1.5 text-center min-w-[96px]">
                <div class="text-[9px] uppercase font-bold tracking-wider text-slate-500">Time</div>
                <div id="hud-timer" class="text-lg sm:text-xl font-mono font-black ${state.isFinished ? 'text-emerald-400' : 'text-indigo-400'}">${formatTime(totalMs)}</div>
              </div>
            </div>
          </div>

          <!-- Compact Matching Grid -->
          <div class="w-full grid ${gridCols} gap-2">
            ${state.deck.map((card, idx) => {
              const isSelected = state.selected.includes(idx);
              const isMatched = state.matched.includes(card.pairId);
              const isMismatch = state.mismatchHighlight.includes(idx);

              let cardClasses = "bg-slate-900 border-slate-700 text-slate-200 hover:bg-slate-800 hover:border-slate-500 cursor-pointer";
              if (isMatched) {
                cardClasses = "bg-emerald-950/35 border-emerald-800/40 text-emerald-500/40 opacity-50 cursor-default animate-pop";
              } else if (isMismatch) {
                cardClasses = "bg-red-950/80 border-red-500 text-red-100 animate-shake";
              } else if (isSelected) {
                cardClasses = "bg-indigo-600 border-indigo-400 text-white shadow-md shadow-indigo-950/70";
              }

              return `
                <button
                  onclick="handleCardClick(${idx})"
                  class="relative flex flex-col items-center justify-center p-2.5 sm:p-3 rounded-xl border-2 transition-all duration-150 min-h-[82px] sm:min-h-[96px] select-none text-center ${cardClasses}"
                >
                  <span class="${card.type === 'word' ? 'text-xs sm:text-sm font-extrabold tracking-tight' : 'text-[11px] sm:text-xs font-medium'} leading-snug break-words">
                    ${escapeHTML(card.text)}
                  </span>
                  ${card.subDef ? `<span class="text-[9px] sm:text-[10px] opacity-75 mt-1 font-semibold">${escapeHTML(card.subDef)}</span>` : ""}
                </button>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function renderHistory() {
      return `
        <div class="w-full max-w-2xl py-2">
          <div class="flex items-center justify-between mb-5">
            <div>
              <h2 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight">Past Times &amp; Mistakes</h2>
              <p class="text-xs text-slate-400">Running log of your speed drill sessions</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="startGame()" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition">
                Play Again
              </button>
              <button onclick="goToView('dashboard')" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700 transition">
                Dashboard
              </button>
            </div>
          </div>

          ${state.history.length === 0 ? `
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-sm text-slate-400">
              No runs recorded yet. Start a drill to log your times!
            </div>
          ` : `
            <div class="space-y-3">
              ${state.history.map(run => {
                const finalMs = run.rawTimeMs + run.penalties * 1000;
                return `
                  <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-md">
                    <div class="px-4 py-3 bg-slate-950/60 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2">
                      <div class="flex flex-wrap items-center gap-1.5">
                        <span class="px-2 py-0.5 rounded-md bg-indigo-500/20 text-indigo-300 text-[10px] font-bold uppercase">${escapeHTML(run.grid)}</span>
                        <span class="px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 text-[10px] font-semibold">${escapeHTML(run.modeLabel)}</span>
                        <span class="text-[10px] text-slate-500">${escapeHTML(run.date)}</span>
                      </div>
                      <div class="flex items-center gap-4">
                        <div class="text-right">
                          <div class="text-[9px] uppercase font-bold text-slate-500">Penalty</div>
                          <div class="text-xs font-mono font-bold ${run.penalties > 0 ? 'text-red-400' : 'text-slate-400'}">+${run.penalties}s</div>
                        </div>
                        <div class="text-right">
                          <div class="text-[9px] uppercase font-bold text-slate-500">Final</div>
                          <div class="text-lg font-mono font-black text-emerald-400">${formatTime(finalMs)}</div>
                        </div>
                      </div>
                    </div>

                    <div class="px-4 py-3 text-xs">
                      ${run.wrongAttempts.length === 0 ? `
                        <div class="text-emerald-400/90 font-medium">Flawless run — 0 wrong matches.</div>
                      ` : `
                        <div class="space-y-1.5">
                          ${run.wrongAttempts.map(m => `
                            <div class="bg-slate-950/60 border border-red-900/40 rounded-lg px-3 py-2 text-slate-300">
                              <span class="text-red-400 font-bold">✕</span>
                              Matched <span class="text-red-200 font-semibold">"${escapeHTML(m.w1)}"</span>
                              with <span class="text-red-200 font-semibold">"${escapeHTML(m.w2)}"</span>
                            </div>
                          `).join("")}
                        </div>
                      `}
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
            <div class="mt-4 flex justify-end">
              <button onclick="clearHistory()" class="text-[11px] text-slate-500 hover:text-red-400 transition">Clear History</button>
            </div>
          `}
        </div>
      `;
    }

    function render() {
      const root = document.getElementById("app");
      if (state.view === "dashboard") root.innerHTML = renderDashboard();
      else if (state.view === "game") root.innerHTML = renderGame();
      else if (state.view === "history") root.innerHTML = renderHistory();
    }

    // Initial render
    render();
  </script>
</body>
</html>
