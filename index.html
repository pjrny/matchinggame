  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      font-variant-numeric: tabular-nums;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }
    .animate-shake {
      animation: shake 0.32s ease-in-out;
    }
    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.22s ease-out;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 selection:bg-indigo-500/30 antialiased">

        subjuntivo: ["juegue", "juegues", "juegue", "juguemos", "jueguen"]
      },
      leer: {
        indefinido: ["leí", "leíste", "leyó", "leímos", "leyeron"]
      },
      creer: {
        indefinido: ["creí", "creíste", "creyó", "creímos", "creyeron"]
      },
      dirigir: {
        presente: ["dirijo", "diriges", "dirige", "dirigimos", "dirigen"],
        subjuntivo: ["dirija", "dirijas", "dirija", "dirijamos", "dirijan"]
      }
    };

    function conjugateSpanish(inf, tense, pIdx) {
      if (tense === "infinitivo") return inf;

      if (tense === "perfecto") {
        const haber = ["he", "has", "ha", "hemos", "han"][pIdx];
        return `${haber} ${getParticiple(inf)}`;
      }
      if (tense === "ir_a") {
        const irForm = ["voy", "vas", "va", "vamos", "van"][pIdx];
        return `${irForm} a ${inf}`;
      }

      const irr = IRREGULAR_MAP[inf];
      if (irr && irr[tense]) {
        return irr[tense][pIdx];
      }

      const ending = inf.slice(-2);
      const stem = inf.slice(0, -2);

      if (tense === "futuro") {
        const fStem = (irr && irr.futuroStem) ? irr.futuroStem : inf;
        const fEnd = ["é", "ás", "á", "emos", "án"][pIdx];
        return fStem + fEnd;
      }

      if (tense === "condicional") {
        const cStem = (irr && irr.futuroStem) ? irr.futuroStem : inf;
        const cEnd = ["ía", "ías", "ía", "íamos", "ían"][pIdx];
        return cStem + cEnd;
      }

      if (tense === "imperfecto") {
        const impEnd = ending === "ar"
          ? ["aba", "abas", "aba", "ábamos", "aban"][pIdx]
          : ["ía", "ías", "ía", "íamos", "ían"][pIdx];
        return stem + impEnd;
      }

      if (tense === "indefinido") {
        if (ending === "ar") {
          let s = stem;
          if (pIdx === 0) {
            if (inf.endsWith("car")) s = stem.slice(0, -1) + "qu";
            else if (inf.endsWith("gar")) s = stem + "u";
            else if (inf.endsWith("zar")) s = stem.slice(0, -1) + "c";
          }
          return s + ["é", "aste", "ó", "amos", "aron"][pIdx];
        }
        return stem + ["í", "iste", "ió", "imos", "ieron"][pIdx];
      }

      if (tense === "subjuntivo") {
        if (ending === "ar") {
          let s = stem;
          if (inf.endsWith("car")) s = stem.slice(0, -1) + "qu";
          else if (inf.endsWith("gar")) s = stem + "u";
          else if (inf.endsWith("zar")) s = stem.slice(0, -1) + "c";
          return s + ["e", "es", "e", "emos", "en"][pIdx];
        }
        return stem + ["a", "as", "a", "amos", "an"][pIdx];
      }

      // Presente regular
      if (ending === "ar") return stem + ["o", "as", "a", "amos", "an"][pIdx];
      if (ending === "er") return stem + ["o", "es", "e", "emos", "en"][pIdx];
      return stem + ["o", "es", "e", "imos", "en"][pIdx];
    }

    const STORAGE_KEYS = {

    function escapeHTML(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function formatTime(ms) {
      return (Math.max(0, ms) / 1000).toFixed(2) + "s";
    }

    let audioCtx = null;
    function getAudioCtx() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return null;
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    // Synthesizes a crisp "cha-ching" coin chime on correct matches
    function playMoneySound() {
      if (!state.config.soundOn) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(987.77, now);        // B5
      osc.frequency.setValueAtTime(1318.51, now + 0.07); // E6
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.28, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.37);
    }

    // Subtle low buzz on wrong match (+1s penalty)
    function playErrorSound() {
      if (!state.config.soundOn) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.linearRampToValueAtTime(120, now + 0.16);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.19);
    }

    function parseDelimitedLine(line, delimiter) {
      const out = [];
      let cur = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === delimiter && !inQuotes) {
          out.push(cur.trim());
          cur = "";
        } else {
          cur += ch;
        }
      }
      out.push(cur.trim());
      return out;
    }

    function extractPairsFromCSV(rawText, target) {
      const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      if (lines.length === 0) return [];
      const sample = lines.slice(0, 5).join("\n");
      const delimiter = sample.includes("\t") ? "\t" : (sample.split(";").length > sample.split(",").length ? ";" : ",");
      const pairs = [];

      lines.forEach((line, idx) => {
        const cols = parseDelimitedLine(line, delimiter).filter((c, i) => !(i === 0 && /^\d+\.?$/.test(c)));
        if (cols.length < 2) return;
        const firstLower = cols[0].toLowerCase();
        if (idx === 0 && ["word", "wort", "verb", "infinitiv", "deutsch", "spanisch", "español"].some(h => firstLower.includes(h))) {
          return;
        }
        if (target === "english" && cols.length >= 3) {
          pairs.push({ word: cols[0], pron: cols[1], def: cols[2] });
        } else {
          const word = cols[0];
          const def = cols[1];
          if (word && def) pairs.push({ word, def });
        }
      });
      return pairs;
    }

    function handleCSVFiles(fileList) {
      const files = Array.from(fileList || []);
      if (files.length === 0) return;
      const fb = document.getElementById("import-feedback");
      let processed = 0;
      const loadedSummary = [];

      files.forEach(file => {
        const name = file.name.toLowerCase();
        let target = "english";
        if (name.includes("gre")) target = "english";
        else if (name.includes("verben")) target = "spanishVerbsCustom";
        else if (name.includes("kern")) target = "kernwortschatz";
        else if (name.includes("praesens") || name.includes("präsens")) target = "es_praesens";
        else if (name.includes("praeteritum") || name.includes("präteritum")) target = "es_praeteritum";
        else if (name.includes("imperfekt")) target = "es_imperfekt";
        else if (name.includes("weitere")) target = "es_weitere";
        else if (name.includes("start")) {
          processed++;
          return;
        }

        const reader = new FileReader();
        reader.onload = e => {
          const pairs = extractPairsFromCSV(String(e.target.result || ""), target);
          if (pairs.length >= 4) {
            customDecks[target] = pairs;
            loadedSummary.push(`${target} (${pairs.length})`);
          }
          processed++;
          if (processed === files.length) {
            saveJSON(STORAGE_KEYS.custom, customDecks);
            updateLoadedDecksSummary();
            if (fb) {
              fb.textContent = loadedSummary.length > 0
                ? `Loaded: ${loadedSummary.join(", ")}`
                : "No valid pairs found in selected files.";
              fb.className = loadedSummary.length > 0
                ? "text-xs mb-2 text-emerald-400 font-semibold"
                : "text-xs mb-2 text-amber-400";
            }
            render();
          }
        };
        reader.readAsText(file);
      });
    }

    function importPastedRows() {
      const target = document.getElementById("paste-target").value;
      const raw = document.getElementById("paste-input").value;
      const fb = document.getElementById("import-feedback");
      const pairs = extractPairsFromCSV(raw, target);
      if (pairs.length < 4) {
        fb.textContent = "Please paste at least 4 valid rows (Word, Definition).";
        fb.className = "text-xs mb-2 text-amber-400";
        return;
      }
      customDecks[target] = pairs;
      saveJSON(STORAGE_KEYS.custom, customDecks);
      document.getElementById("paste-input").value = "";
      fb.textContent = `Saved ${pairs.length} pairs to ${target}!`;
      fb.className = "text-xs mb-2 text-emerald-400 font-semibold";
      updateLoadedDecksSummary();
      render();
    }

      customDecks = {};
      saveJSON(STORAGE_KEYS.custom, customDecks);
      const fb = document.getElementById("import-feedback");
      if (fb) {

      if (!el) return;
      const keys = Object.keys(customDecks);

      } else {

          keys.map(k => `<span class="inline-block bg-slate-800 px-1.5 py-0.5 rounded mr-1 mt-1">${escapeHTML(k)} (${customDecks[k].length})</span>`).join("");
      }

    function buildBakedHTMLString() {
      const docHTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const serialized = JSON.stringify(customDecks);
      return docHTML.replace(
        /\/\*__BAKED_DECKS_START__\*\/[\s\S]*?\/\*__BAKED_DECKS_END__\*\//,
        `/*__BAKED_DECKS_START__*/ ${serialized} /*__BAKED_DECKS_END__*/`
      );
    }

    function downloadBakedHTML() {
      const html = buildBakedHTMLString();
      const blob = new Blob([html], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "vocab-speed-drill.html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      const fb = document.getElementById("export-feedback");
      if (fb) fb.textContent = "Downloaded vocab-speed-drill.html!";
    }

    function copyTextFallback(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand("copy");
      } catch {
        // Ignore copy failure
      }
      document.body.removeChild(ta);
    }

    function copyCloudflareWorker() {
      const html = buildBakedHTMLString();
      const escaped = html
        .replace(/\\/g, "\\\\")
        .replace(/`/g, "\\`")
        .replace(/\$\{/g, "\\${");
      const workerCode = `export default {\n  async fetch() {\n    const html = \`${escaped}\`;\n    return new Response(html, {\n      headers: { "content-type": "text/html;charset=UTF-8" }\n    });\n  }\n};\n`;
      copyTextFallback(workerCode);
      const fb = document.getElementById("export-feedback");
      if (fb) fb.textContent = "Copied Cloudflare Worker JS to clipboard!";
    }

    function clearHistory() {
      state.history = [];
      saveJSON(STORAGE_KEYS.history, []);
      render();
    }

    function buildPairsForCurrentMode() {
      const { mode, tense, gridSize } = state.config;
      const pairCount = gridSize / 2;

      if (mode === "english") {
        const pool = customDecks.english?.length ? customDecks.english : defaultEnglishVocab;
        const picked = [];
        const seen = new Set();
        for (const item of shuffleArray(pool)) {
          const key = item.word.toLowerCase();
          if (seen.has(key)) continue;
          seen.add(key);
          picked.push({ word: item.word, subWord: item.pron || "", def: item.def });
          if (picked.length === pairCount) break;
        }
        return picked;
      }

      if (mode === "german") {
        const pool = customDecks.german?.length ? customDecks.german : defaultGermanVocab;
        return shuffleArray(pool).slice(0, pairCount);
      }

      if (mode === "spanish") {
        const pool = customDecks.spanish?.length ? customDecks.spanish : defaultSpanishVocab;
        return shuffleArray(pool).slice(0, pairCount);
      }

      if (mode === "kernwortschatz") {
        const pool = customDecks.kernwortschatz?.length ? customDecks.kernwortschatz : defaultKernwortschatz;
        return shuffleArray(pool).slice(0, pairCount);
      }

      // Spanish Verbs -> German
      const csvTenseMap = {
        infinitivo: customDecks.spanishVerbsCustom,
        presente: customDecks.es_praesens,
        indefinido: customDecks.es_praeteritum,
        imperfecto: customDecks.es_imperfekt,
        weitere: customDecks.es_weitere
      };

      if (tense !== "mixed" && csvTenseMap[tense]?.length >= pairCount) {
        return shuffleArray(csvTenseMap[tense]).slice(0, pairCount);
      }

      if (tense === "mixed") {
        const allCsvVerbs = Object.values(csvTenseMap).filter(Boolean).flat();
        if (allCsvVerbs.length >= pairCount) {
          return shuffleArray(allCsvVerbs).slice(0, pairCount);
        }
      }

      const activeTenses = ["presente", "indefinido", "imperfecto", "perfecto", "ir_a", "futuro", "condicional", "subjuntivo"];
      const pickedVerbs = shuffleArray(spanish100Verbs).slice(0, pairCount);

      return pickedVerbs.map(v => {
        const chosenTense = tense === "mixed"
          ? activeTenses[Math.floor(Math.random() * activeTenses.length)]
          : (TENSE_META[tense] ? tense : "presente");

        if (chosenTense === "infinitivo") {
          return {
            word: v.inf,
            def: v.de,
            subDef: TENSE_META.infinitivo.deTag
          };
        }

        const pIdx = Math.floor(Math.random() * PRONOUNS_ES.length);
        const conjugated = conjugateSpanish(v.inf, chosenTense, pIdx);
        return {
          word: `${PRONOUNS_ES[pIdx]} ${conjugated}`,
          def: `${PRONOUNS_DE[pIdx]} — ${v.de}`,
          subDef: TENSE_META[chosenTense].deTag
        };
      });
    }

    function getModeLabel() {
      const { mode, tense } = state.config;
      if (mode === "english") return "GRE English";
      if (mode === "german") return "German → DE";
      if (mode === "spanish") return "Spanish → EN";
      if (mode === "kernwortschatz") return "Kernwortschatz";
      const tLabel = tense === "mixed" ? "All Tenses" : (TENSE_META[tense]?.label || tense);
      return `ES Verbs → DE (${tLabel})`;
    }

    function startGame() {
      cancelAnimationFrame(state.rafId);
      const pairs = buildPairsForCurrentMode();
      const cards = [];

      pairs.forEach((p, idx) => {
        const pairId = `p-${idx}`;
        cards.push({ id: `w-${idx}`, pairId, type: "word", text: p.word, subDef: p.subWord || "" });
        cards.push({ id: `d-${idx}`, pairId, type: "definition", text: p.def, subDef: p.subDef || "" });
      });

      state.deck = shuffleArray(cards);
      state.selected = [];
      state.matched = [];
      state.mismatchHighlight = [];
      state.penalties = 0;
      state.wrongLogs = [];
      state.isFinished = false;
      state.startTime = performance.now();
      state.elapsed = 0;
      state.view = "game";
      render();

      const tick = () => {
        if (state.view !== "game" || state.isFinished) return;
        state.elapsed = performance.now() - state.startTime;
        const timerEl = document.getElementById("hud-timer");
        if (timerEl) {
          timerEl.textContent = formatTime(state.elapsed + state.penalties * 1000);
        }
        state.rafId = requestAnimationFrame(tick);
      };
      state.rafId = requestAnimationFrame(tick);
    }

    function handleCardClick(idx) {
      const card = state.deck[idx];
      if (
        !card ||
        state.isFinished ||
        state.matched.includes(card.pairId) ||
        state.selected.includes(idx) ||
        state.selected.length >= 2 ||
        state.mismatchHighlight.length > 0
      ) {
        return;
      }

      state.selected.push(idx);
      render();

      if (state.selected.length === 2) {
        const [firstIdx, secondIdx] = state.selected;
        const firstCard = state.deck[firstIdx];
        const secondCard = state.deck[secondIdx];

        if (firstCard.pairId === secondCard.pairId) {
          playMoneySound();
          state.matched.push(firstCard.pairId);
          state.selected = [];

          if (state.matched.length === state.config.gridSize / 2) {
            state.isFinished = true;
            state.elapsed = performance.now() - state.startTime;
            cancelAnimationFrame(state.rafId);

            const runRecord = {
              id: Date.now(),
              date: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
              grid: `${state.config.gridSize} Blocks`,
              modeLabel: getModeLabel(),
              rawTimeMs: state.elapsed,
              penalties: state.penalties,
              wrongAttempts: [...state.wrongLogs]
            };
            state.history = [runRecord, ...state.history].slice(0, 50);
            saveJSON(STORAGE_KEYS.history, state.history);
            render();

            setTimeout(() => {
              if (state.view === "game" && state.isFinished) {
                state.view = "history";
                render();
              }
            }, 650);
          } else {
            render();
          }
        } else {
          playErrorSound();
          state.penalties += 1;
          state.mismatchHighlight = [firstIdx, secondIdx];
          state.wrongLogs.push({ w1: firstCard.text, w2: secondCard.text });
          render();

          setTimeout(() => {
            state.selected = [];
            state.mismatchHighlight = [];
            if (state.view === "game") render();
          }, 480);
        }
      }
    }

        <div class="flex-1 flex items-center justify-center p-4">
          <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl animate-pop">
            <div class="flex items-center justify-between mb-5">
              <div>
                <h1 class="text-2xl font-black tracking-tight text-white">Speed Match</h1>
                <p class="text-xs text-slate-400 mt-0.5">Match fast. Wrong match adds +1.00s.</p>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="setConfig('soundOn', ${!soundOn})" title="Toggle sound" class="p-2 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 text-xs font-bold transition">
                  ${soundOn ? "🔊" : "🔇"}
                </button>
                <button onclick="openImportModal()" class="px-2.5 py-2 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 text-indigo-300 text-xs font-bold transition">
                  + CSV / Export
                </button>
              </div>
            </div>

            <div class="space-y-5">
              <!-- Grid Size -->
              <div>
                <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2 block">Grid Size</label>
                <div class="grid grid-cols-2 gap-2.5">
                  <button onclick="setConfig('gridSize', 8)" class="py-2.5 rounded-xl border-2 text-xs font-bold transition ${gridSize === 8 ? 'border-indigo-500 bg-indigo-500/20 text-indigo-200' : 'border-slate-800 bg-slate-950/50 hover:border-slate-600 text-slate-400'}">
                    8 Blocks (4 Pairs)
                  </button>
                  <button onclick="setConfig('gridSize', 12)" class="py-2.5 rounded-xl border-2 text-xs font-bold transition ${gridSize === 12 ? 'border-indigo-500 bg-indigo-500/20 text-indigo-200' : 'border-slate-800 bg-slate-950/50 hover:border-slate-600 text-slate-400'}">
                    12 Blocks (6 Pairs)
                  </button>
                </div>
              </div>

              <!-- Vocab Pool -->
              <div>
                <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2 block">Vocab Pool</label>
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="setConfig('mode', 'english')" class="p-2.5 rounded-xl border-2 text-left transition ${mode === 'english' ? 'border-emerald-500 bg-emerald-500/15 text-emerald-200' : 'border-slate-800 bg-slate-950/50 hover:border-slate-600 text-slate-400'}">
                    <div class="text-xs font-bold">GRE English</div>
                    <div class="text-[10px] opacity-75 mt-0.5">${greCount} hard GRE words</div>
                  </button>

                  <button onclick="setConfig('mode', 'spanishVerbs')" class="p-2.5 rounded-xl border-2 text-left transition ${mode === 'spanishVerbs' ? 'border-cyan-500 bg-cyan-500/15 text-cyan-200' : 'border-slate-800 bg-slate-950/50 hover:border-slate-600 text-slate-400'}">
                    <div class="text-xs font-bold">ES Verbs → DE</div>
                    <div class="text-[10px] opacity-75 mt-0.5">${esVerbCount} verbs • all tenses</div>
                  </button>

                  <button onclick="setConfig('mode', 'german')" class="p-2.5 rounded-xl border-2 text-left transition ${mode === 'german' ? 'border-amber-500 bg-amber-500/15 text-amber-200' : 'border-slate-800 bg-slate-950/50 hover:border-slate-600 text-slate-400'}">
                    <div class="text-xs font-bold">German → DE</div>
                    <div class="text-[10px] opacity-75 mt-0.5">${deCount} German defs</div>
                  </button>

                  <button onclick="setConfig('mode', 'spanish')" class="p-2.5 rounded-xl border-2 text-left transition ${mode === 'spanish' ? 'border-fuchsia-500 bg-fuchsia-500/15 text-fuchsia-200' : 'border-slate-800 bg-slate-950/50 hover:border-slate-600 text-slate-400'}">
                    <div class="text-xs font-bold">Spanish → EN</div>
                    <div class="text-[10px] opacity-75 mt-0.5">${esCount} English defs</div>
                  </button>

                  <button onclick="setConfig('mode', 'kernwortschatz')" class="col-span-2 p-2.5 rounded-xl border-2 text-left transition ${mode === 'kernwortschatz' ? 'border-violet-500 bg-violet-500/15 text-violet-200' : 'border-slate-800 bg-slate-950/50 hover:border-slate-600 text-slate-400'}">
                    <div class="text-xs font-bold">Kernwortschatz (ES → DE)</div>
                    <div class="text-[10px] opacity-75 mt-0.5">${kernCount} core vocabulary pairs</div>
                  </button>
                </div>
              </div>

              <!-- Tense Selector (Shown for Spanish Verbs mode) -->
              ${mode === "spanishVerbs" ? `
                <div>
                  <label class="text-[11px] font-bold uppercase tracking-wider text-cyan-400/90 mb-2 block">Spanish Verb Tense</label>
                  <div class="grid ${hasCSVTenses ? 'grid-cols-3' : 'grid-cols-5'} gap-1.5">
                    ${tenseOptions.map(t => `
                      <button onclick="setConfig('tense', '${t.id}')" class="py-1.5 px-1 rounded-lg border text-[10px] font-bold transition truncate ${tense === t.id ? 'border-cyan-400 bg-cyan-500/20 text-cyan-200' : 'border-slate-800 bg-slate-950/60 text-slate-400 hover:border-slate-600'}">
                        ${t.label}
                      </button>
                    `).join("")}
                  </div>
                </div>
              ` : ""}
            </div>

            <!-- Action Buttons -->
            <div class="mt-6 space-y-2.5">
              <button onclick="startGame()" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-extrabold text-sm tracking-wide transition shadow-lg shadow-indigo-900/40">
                ▶ Start Speed Drill
              </button>
              ${state.history.length > 0 ? `
                <button onclick="goToView('history')" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs transition border border-slate-700">
                  View Past Runs (${state.history.length})
                </button>
              ` : ""}
            </div>
          </div>
        </div>
      `;
    }

    function renderGame() {
      const totalTime = state.elapsed + state.penalties * 1000;
      const gridCols = state.config.gridSize === 12 ? "grid-cols-3 sm:grid-cols-4" : "grid-cols-2 sm:grid-cols-4";

      return `
        <div class="flex-1 flex flex-col items-center p-3 sm:p-5 max-w-2xl w-full mx-auto">
          <!-- Top HUD -->
          <div class="w-full flex items-center justify-between bg-slate-900/90 border border-slate-800 rounded-2xl px-3.5 py-2.5 mb-3 shadow-lg">
            <button onclick="goToView('dashboard')" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition text-sm font-bold" aria-label="Exit drill">
              ✕
            </button>

            <div class="text-center">
              <div class="text-[10px] font-bold uppercase tracking-wider text-slate-500">${escapeHTML(getModeLabel())}</div>
              <div id="hud-timer" class="text-xl sm:text-2xl font-black font-mono-num ${state.isFinished ? 'text-emerald-400' : 'text-indigo-300'}">
                ${formatTime(totalTime)}
              </div>
            </div>

            <div class="flex items-center gap-2">
              <div class="text-right px-2 py-1 rounded-lg bg-slate-950 border border-slate-800">
                <div class="text-[9px] uppercase font-bold text-slate-500">Penalty</div>
                <div class="text-xs font-mono-num font-bold ${state.penalties > 0 ? 'text-rose-400' : 'text-slate-400'}">+${state.penalties}s</div>
              </div>
              <button onclick="setConfig('soundOn', ${!state.config.soundOn})" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs transition" aria-label="Toggle sound">
                ${state.config.soundOn ? "🔊" : "🔇"}
              </button>
            </div>
          </div>

          <!-- Compact Match Grid -->
          <div class="w-full grid ${gridCols} gap-2">
            ${state.deck.map((card, idx) => {
              const isSelected = state.selected.includes(idx);
              const isMatched = state.matched.includes(card.pairId);
              const isMismatch = state.mismatchHighlight.includes(idx);

              let styleClass = "bg-slate-900 border-slate-700/80 text-slate-200 hover:border-slate-500 hover:bg-slate-800/80 cursor-pointer";
              if (isMatched) {
                styleClass = "bg-emerald-950/30 border-emerald-800/40 text-emerald-500/40 cursor-default opacity-45 scale-[0.98]";
              } else if (isMismatch) {
                styleClass = "bg-rose-950/90 border-rose-500 text-rose-100 animate-shake";
              } else if (isSelected) {
                styleClass = "bg-indigo-600 border-indigo-400 text-white shadow-md shadow-indigo-900/50 scale-[0.98]";
              }

              return `
                <button
                  onclick="handleCardClick(${idx})"
                  ${isMatched ? "disabled" : ""}
                  class="flex flex-col items-center justify-center text-center p-2 sm:p-2.5 rounded-xl border-2 transition-all duration-150 min-h-[82px] sm:min-h-[96px] select-none ${styleClass}"
                >
                  <span class="${card.type === 'word' ? 'text-xs sm:text-sm font-bold' : 'text-[11px] sm:text-xs font-medium'} leading-snug break-words">
                    ${escapeHTML(card.text)}
                  </span>
                  ${card.subDef ? `
                    <span class="text-[9px] sm:text-[10px] mt-1 opacity-70 font-medium leading-tight">
                      ${escapeHTML(card.subDef)}
                    </span>
                  ` : ""}
                </button>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function renderHistory() {
      return `
        <div class="flex-1 w-full max-w-2xl mx-auto p-4 sm:p-6 animate-pop">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
            <div>
              <h2 class="text-2xl font-black text-white">Past Runs &amp; Mistakes</h2>
              <p class="text-xs text-slate-400">Saved automatically in your browser</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="startGame()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition">
                ▶ Play Again
              </button>
              <button onclick="goToView('dashboard')" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold border border-slate-700 transition">
                Settings
              </button>
            </div>
          </div>

          ${state.history.length === 0 ? `
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center text-slate-400 text-sm">
              No runs recorded yet. Complete a drill to see your times and mistake log.
            </div>
          ` : `
            <div class="space-y-3">
              ${state.history.map(run => {
                const finalTime = run.rawTimeMs + run.penalties * 1000;
                return `
                  <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-md">
                    <div class="px-4 py-3 bg-slate-950/60 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2">
                      <div class="flex flex-wrap items-center gap-1.5">
                        <span class="px-2 py-0.5 rounded-md bg-indigo-500/20 text-indigo-300 text-[10px] font-bold uppercase">${escapeHTML(run.grid)}</span>
                        <span class="px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 text-[10px] font-bold">${escapeHTML(run.modeLabel)}</span>
                        <span class="text-[10px] text-slate-500">${escapeHTML(run.date)}</span>
                      </div>
                      <div class="flex items-center gap-4">
                        <div class="text-right">
                          <div class="text-[9px] uppercase font-bold text-slate-500">Penalty</div>
                          <div class="text-xs font-mono-num font-bold ${run.penalties > 0 ? 'text-rose-400' : 'text-slate-400'}">+${run.penalties}s</div>
                        </div>
                        <div class="text-right">
                          <div class="text-[9px] uppercase font-bold text-slate-500">Final Time</div>
                          <div class="text-lg font-mono-num font-black text-emerald-400">${formatTime(finalTime)}</div>
                        </div>
                      </div>
                    </div>

                    <div class="p-3.5 text-xs">
                      ${run.wrongAttempts.length === 0 ? `
                        <div class="text-emerald-400/90 font-medium">✓ Flawless run — no wrong matches!</div>
                      ` : `
                        <div class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2">Wrong Matches (${run.wrongAttempts.length})</div>
                        <div class="space-y-1.5">
                          ${run.wrongAttempts.map(m => `
                            <div class="bg-slate-950/70 border border-rose-900/40 rounded-lg px-2.5 py-1.5 text-slate-300">
                              <span class="text-rose-300 font-semibold">"${escapeHTML(m.w1)}"</span>
                              <span class="text-slate-500 mx-1">≠</span>
                              <span class="text-rose-300 font-semibold">"${escapeHTML(m.w2)}"</span>
                            </div>
                          `).join("")}
                        </div>
                      `}
                    </div>
                  </div>
                `;
              }).join("")}
            </div>

            <div class="mt-5 text-right">
              <button onclick="clearHistory()" class="text-xs text-slate-500 hover:text-rose-400 transition">Clear History</button>
            </div>
          `}
        </div>
      `;
    }

    function render() {
      const root = document.getElementById("app");
      if (!root) return;
      if (state.view === "dashboard") root.innerHTML = renderDashboard();
      else if (state.view === "game") root.innerHTML = renderGame();
      else root.innerHTML = renderHistory();
    }

    // Boot App
    render();
  </script>
</body>
</html>
